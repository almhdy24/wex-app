name: CI (analyze, test, build APK)

on:
  push:
    branches: [ main, stabilize ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # HelioHost-hosted API is same-origin by default; override per flavor if needed.
      - name: Build debug APK (release on tag)
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            flutter build apk --release --dart-define=WEX_ORIGIN=https://wex-technology.com
          else
            flutter build apk --debug --dart-define=WEX_ORIGIN=https://wex-technology.com
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wex-app-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
